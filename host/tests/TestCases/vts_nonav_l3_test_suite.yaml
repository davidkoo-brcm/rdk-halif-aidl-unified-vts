nonAvL3TestSuite:
  description: "Config-driven Non-AV L3 host tests"
  tests:
    - module: "flash"
      tests:
        - "VTS_FLASH_L3_TestAllImages"
        - "VTS_FLASH_L3_ConcurrentImage"
        - "VTS_FLASH_L3_ValidateAllErrorCodes"

    - module: "motionsensor"
      tests:
        - "VTS_MOTIONSENSOR_L3_ActiveWindowBehavior"
        - "VTS_MOTIONSENSOR_L3_DeepSleepAutonomy"
        - "VTS_MOTIONSENSOR_L3_MotionEventDetection"

    - module: "thermalsensor"
      tests:
        - "VTS_THERMALSENSOR_L3_CriticalShutdownWithSuppression"
        - "VTS_THERMALSENSOR_L3_ThermalExceedRecoveryLifecycle"
