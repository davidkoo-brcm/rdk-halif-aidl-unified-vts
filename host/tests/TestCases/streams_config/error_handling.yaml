# =============================================================================
# ERROR HANDLING & ROBUSTNESS TEST CASES
# Purpose: Validate decoder resilience with corrupted streams
# Includes: AV Stream Errors, Audio Only Errors, Video Only Errors
# =============================================================================

AVModule:
  input_streams_path: assets/streams/input
  player: gstreamer
  L4Test:
  # ---------------------------------------------------------------------------
  # 1.4 AV Playback - Video Stream Corruption (with Valid Audio)
  # ---------------------------------------------------------------------------
  - tcid: VTS_L4_H264_ERR_9001
    use_case: "Video Corruption - Valid Audio"
    action: normal_play
    error_condition: "H264 Bitflip slice"
    stream_name: "AV/Error_Streams/vts_h264_1080p_slice_corruption_with_valid_aac_60sec.mp4"

  - tcid: VTS_L4_H264_ERR_9002
    use_case: "Video Corruption - Valid Audio"
    action: normal_play
    error_condition: "H264 NAL header"
    stream_name: "AV/Error_Streams/vts_h264_1080p_nal_header_corruption_with_valid_aac_60sec.mp4"

  - tcid: VTS_L4_H265_ERR_9001
    use_case: "Video Corruption - Valid Audio"
    action: normal_play
    error_condition: "HEVC Slice segment"
    stream_name: "AV/Error_Streams/vts_h265_1080p_slice_corruption_with_valid_ac3_60sec.mp4"

  - tcid: VTS_L4_VP9_ERR_9001
    use_case: "Video Corruption - Valid Audio"
    action: normal_play
    error_condition: "VP9 Frame header"
    stream_name: "AV/Error_Streams/vts_vp9_1080p_header_corruption_with_valid_opus_60sec.webm"

  - tcid: VTS_L4_AV1_ERR_9001
    use_case: "Video Corruption - Valid Audio"
    action: normal_play
    error_condition: "AV1 OBU corruption"
    stream_name: "AV/Error_Streams/vts_av1_1080p_obu_corruption_with_valid_aac_60sec.mp4"

  # ---------------------------------------------------------------------------
  # 1.4 AV Playback - Audio Stream Corruption (with Valid Video)
  # ---------------------------------------------------------------------------
  - tcid: VTS_L4_AAC_ERR_9001
    use_case: "Audio Corruption - Valid Video"
    action: normal_play
    error_condition: "AAC ADTS header"
    stream_name: "AV/Error_Streams/vts_h264_1080p_valid_video_with_aac_adts_corruption_60sec.mp4"

  - tcid: VTS_L4_AC3_ERR_9001
    use_case: "Audio Corruption - Valid Video"
    action: normal_play
    error_condition: "AC3 Sync frame"
    stream_name: "AV/Error_Streams/vts_h264_1080p_valid_video_with_ac3_sync_corruption_60sec.mp4"

  - tcid: VTS_L4_EAC3_ERR_9002
    use_case: "Audio Corruption - Valid Video"
    action: normal_play
    error_condition: "EAC3 Header"
    stream_name: "AV/Error_Streams/vts_h265_1080p_valid_video_with_eac3_header_corruption_60sec.mp4"

  # ---------------------------------------------------------------------------
  # 2.3 Audio Only - Robustness & Error Handling
  # ---------------------------------------------------------------------------
  - tcid: VTS_L4_AAC_1401
    use_case: "Audio Only Error Handling"
    action: normal_play
    error_condition: "ADTS header corruption"
    stream_name: "Audio/Error_Streams/AAC/vts_aac_48k_6ch_adts_header_corruption_512k_a2814_v0_61sec.mp4"

  - tcid: VTS_L4_AAC_1402
