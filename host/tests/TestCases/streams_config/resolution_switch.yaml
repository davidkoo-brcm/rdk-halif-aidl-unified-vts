# =============================================================================
# NORMAL PLAYBACK TEST CASES
# Covers: AV Playback, Audio Only, Video Only
# Includes: Baseline, HDR Metadata, Pixel Formats, Interlaced, Low Bitrate, ABR
# =============================================================================

AVModule:
  input_streams_path: assets/streams/input
  player: gstreamer
  L4Test:
  # ---------------------------------------------------------------------------
  # 1.1 AV Playback - Baseline AV Playback HD
  # Purpose: Validate complete decoder lifecycle including open/start/decode/
  # queue operations, callback handling, stop/flush/EOS sequences, and basic
  # audio-video synchronization
  # ---------------------------------------------------------------------------
  - tcid: VTS_L4_H265_VARIABLE_HDR10_60
    use_case: "Resolution switch"
    action: resolution_switch
    codec: "H265 HDR10 EAC3"
    stream_name: "Audio_Video/ABR/vts_h265_variable_hdr10_60.0f_BT2020_yuv420p_abr_eac3_48k_6ch_abr_a9380_v18000_300sec.mp4"

  - tcid: VTS_L4_H265_VARIABLE_SDR_25
    use_case: "Resolution switch"
    action: resolution_switch
    codec: "H265 SDR AC3"
    stream_name: "Audio_Video/ABR/vts_h265_variable_sdr_25.0f_BT709_yuv420p_abr_ac3_48k_6ch_abr_a9380_v7500_300sec.mp4"

  - tcid: VTS_L4_H265_VARIABLE_SDR_30
    use_case: "Resolution switch"
    action: resolution_switch
    codec: "H265 SDR AC3"
    stream_name: "Audio_Video/ABR/vts_h264_variable_sdr_30.0f_BT709_yuv420p_abr_aac_48k_6ch_abr_a14080_v9000_300sec.mp4"

