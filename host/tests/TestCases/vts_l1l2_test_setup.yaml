# This is a sample test configuration file. Users can customize the YAML entries as needed
# This test configuration file includes sample YAML entries for executing various combinations
VTS:
  description: "VTS L1 and L2 test setup"
  num_of_instances: 1
  test:
    artifacts:
      - "../../../build/vts_unified.tar.gz.bz"
    execute: "./run.sh"
    type: UT-C # C (UT-C Cunit) / C++ (UT-G (g++ ut-core gtest backend))
    suites:
      0:
        name: "VTS_L1_AudioDecoder"
        tests:
          - getAudioDecoderIds_pos
          - getAudioDecoder_pos
          - getAudioDecoder_neg
          - getCapabilities_pos
          - getProperty_pos
          - getProperty_neg
          - getState_pos
          - open_pos
          - open_neg
          - close_pos
          - close_neg
          - registerEventListener_pos
          - registerEventListener_neg
          - unregisterEventListener_pos
          - unregisterEventListener_neg
          - start_pos
          - start_neg
          - stop_pos
          - stop_neg
          - decodeBuffer_neg
          - flush_pos
          - flush_neg
          - signalDiscontinuity_pos
          - signalDiscontinuity_neg
          - signalEOS_pos
          - signalEOS_neg
          - parseCodecSpecificData_pos
          - parseCodecSpecificData_neg
          - setProperty_pos
          - setProperty_neg

      1:
        name: "VTS_L2_AudioDecoder"
        tests:
          - SetandGetProperties
          - SetandGetProperties_multipleInstance
          - StateTransitions
          - StateTransitions_mutipleInstance
      2:
        name: "VTS_L1_AudioSink"
        tests:
          - getAudioSinkIds_pos
          - getPlatformCapabilities_pos
          - getAudioSink_pos
          - getAudioSink_neg
          - getCapabilities_pos
          - getProperty_pos
          - getProperty_neg
          - setProperty_pos
          - setProperty_neg
          - getState_pos
          - open_pos
          - open_neg
          - close_pos
          - close_neg
          - registerEventListener_pos
          - registerEventListener_neg
          - unregisterEventListener_pos
          - unregisterEventListener_neg
          - setAudioDecoder_pos
          - setAudioDecoder_neg
          - getAudioDecoder_pos
          - start_pos
          - start_neg
          - stop_pos
          - stop_neg
          - queueAudioFrame_neg
          - flush_pos
          - flush_neg
          - getVolume_pos
          - setVolume_pos
          - setVolume_neg
          - setVolumeRamp_pos
          - setVolumeRamp_neg
      3:
        name: "VTS_L2_AudioSink"
        tests:
          - TestReadWriteProperties
          - TestStateTransition
          - TestAudioSinkVolumeControl
          - TestAudioSinkMuteUnmute
          - TestAudioSinkVolumeRamp
          - TestAudioSinkVolumeRampMute
          - TestAudioSinkVolumeRampTwice
          - TestStopAudioSinkVolRampProgress
